[project]
name = "aihf-web-backend"
version = "0.1.0"
description = "Web API over the aihf (ai-hedge-fund) engine: mandates, backtests, paper funds"
requires-python = ">=3.11,<3.13"
dependencies = [
    "aihf==2.7.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
